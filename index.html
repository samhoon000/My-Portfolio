<html lang="en">

    <!-- Intro animation. Plays once per tab session (add ?intro to the URL to replay), then hands off to the site.
         Timeline (s): 0 grid + scattered data · .34 ball drops in · .58–1.36 hops and sorts the data into a chart ·
         1.36 leaps to the peak · 1.78 dark green floods out from it · 2.18 wordmark · ~2.8 the wordmark docks into
         the real header and the overlay opens onto the hero (driven by the script at the top of <body>). -->
    <style>
      html.intro-on .signal-graphic svg,html.intro-on .signal-path{animation-play-state:paused}
      html.intro-on .site-header .wordmark{visibility:hidden}
      .intro{--hh:78px;--k:3;--frame:min(calc(100% - 100px),1480px);position:fixed;inset:0;z-index:999;overflow:hidden;color:#18221e;font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;transition:opacity .35s ease}
      .intro *{box-sizing:border-box}
      .intro p{margin:0}
      .intro.is-fading{opacity:0}
      .intro.is-docking{pointer-events:none}
      .intro__paper,.intro__inkwrap,.intro__ink,.intro__stagebox,.intro__brand{position:absolute;inset:0}

      /* Paper stage: technical grid, scattered data */
      .intro__paper{background:#f0eee7}
      .intro__grid{position:absolute;left:0;right:0;top:var(--hh);bottom:0}
      .intro__grid--v{background:linear-gradient(90deg,rgba(24,34,30,.08) 1px,transparent 1px) 0 0/14.28% 100%;animation:i-wipe-y .8s cubic-bezier(.6,0,.2,1) both}
      .intro__grid--h{background:linear-gradient(rgba(24,34,30,.08) 1px,transparent 1px) 0 0/100% 20%;animation:i-wipe-x .8s cubic-bezier(.6,0,.2,1) .08s both}
      .intro__frame{position:absolute;left:0;right:0;top:calc(var(--hh) + 26px);width:var(--frame);margin:0 auto;display:flex;justify-content:space-between;gap:20px;color:#69716b;font:10px/1.4 'DM Mono',monospace;letter-spacing:.08em;white-space:nowrap}
      .intro__paper .intro__frame{animation:i-fade .5s ease .15s both}
      .intro__cap{position:relative}
      .intro__cap span{display:block}
      .intro__cap span:first-child{animation:i-out .2s ease .58s forwards}
      .intro__cap span+span{position:absolute;left:0;top:0;animation:i-fade .3s ease .64s both}
      .intro__stagebox{display:flex;align-items:center;justify-content:center;padding-top:calc(var(--hh) * .5)}
      .intro__stage{display:block;flex:none;width:min(calc(100vw - 32px),860px,max(260px,calc((100vh - 230px) * 1.7)));height:auto;aspect-ratio:720/420;overflow:visible}
      .intro__paper .intro__stage{animation:i-settle 1.7s cubic-bezier(.2,.7,.2,1) both}

      /* Ink stage: the hero's dark green, grid and orbit line, revealed by a flood from the insight point */
      .intro__inkwrap{clip-path:inset(0);transition:clip-path .6s cubic-bezier(.7,0,.2,1),opacity .45s ease}
      .intro__ink{background:#171f1b;clip-path:circle(150% at var(--fx,50%) var(--fy,50%));animation:i-flood .55s cubic-bezier(.7,0,.25,1) 1.78s both}
      .intro__ink .intro__frame{color:#b7c2b4}
      .intro__ink .intro__stage{animation:i-recede .55s cubic-bezier(.4,0,.2,1) 2.18s both}
      .intro__herobox{position:absolute;left:0;right:0;top:var(--gt,var(--hh));height:var(--gh,calc(100% - var(--hh)));overflow:hidden}
      .intro__herobox::before{content:'';position:absolute;left:-22vw;bottom:-60vw;width:110vw;height:110vw;border:1px solid rgba(231,239,222,.15);border-radius:50%}
      .intro__herogrid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(90deg,#f1f1df 1px,transparent 1px),linear-gradient(#f1f1df 1px,transparent 1px);background-size:14.28% 100%,100% 20%;-webkit-mask-image:linear-gradient(90deg,transparent 12%,#000 70%);mask-image:linear-gradient(90deg,transparent 12%,#000 70%)}

      /* Chart */
      .intro svg text{font:11px 'DM Mono',monospace;letter-spacing:.04em}
      .intro .c-base,.intro .c-ref,.intro .c-stem,.intro .c-trend,.intro .c-scrib{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .intro .c-base{stroke:rgba(24,34,30,.55);stroke-width:1.3}
      .intro .c-ref{stroke:rgba(24,34,30,.16);stroke-linecap:butt}
      .intro .c-stem{stroke:rgba(24,34,30,.42);stroke-width:1.5}
      .intro .c-dot,.intro .c-ball{fill:#18221e}
      .intro .c-lab,.intro .c-xl{fill:#69716b}
      .intro .c-lab{text-anchor:end}
      .intro .c-xl{font-size:10px;text-anchor:middle}
      .intro .c-trend{stroke:#ea7253;stroke-width:3}
      .intro .c-peak{fill:#ea7253;filter:drop-shadow(0 0 9px #ea7253)}
      .intro .c-scrib{stroke:#d5fa65;stroke-width:1.6}
      .intro .c-ann{fill:#d5fa65;font:italic 30px 'Instrument Serif',Georgia,serif;letter-spacing:0}
      .intro .c-shadow{fill:rgba(24,34,30,.18)}
      .intro .c-pulse{fill:none;stroke:#ea7253;stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:0}
      .intro .n text{font-size:13px;fill:rgba(24,34,30,.6)}
      .intro .n :not(text){fill:none;stroke:rgba(24,34,30,.5);stroke-width:1.3}
      .intro__ink .c-base{stroke:rgba(217,228,211,.45)}
      .intro__ink .c-ref{stroke:rgba(217,228,211,.14)}
      .intro__ink .c-stem{stroke:rgba(217,228,211,.4)}
      .intro__ink .c-dot{fill:#f6f4eb}
      .intro__ink .c-lab,.intro__ink .c-xl{fill:#b7c2b4}

      /* Chart motion: scattered (.s) items snap into place, noise (.n) is cleared, the ball (.b-*) does the sorting */
      .intro .s,.intro .s>*,.intro .n,.intro .b-sq,.intro .b-sq2,.intro .c-shadow,.intro .c-pulse{transform-box:fill-box;transform-origin:50% 50%}
      .intro .b-sq,.intro .b-sq2{transform-origin:50% 100%}
      .intro .far{animation:i-drift 1.5s cubic-bezier(.2,.7,.3,1) both}
      .intro .s{animation:i-sort .4s cubic-bezier(.3,1.3,.5,1) var(--m) both}
      .intro .s>*{animation:i-pop .38s cubic-bezier(.3,1.5,.5,1) var(--t) both,i-norm .4s ease var(--m) forwards}
      .intro .n{animation:i-pop .38s cubic-bezier(.3,1.5,.5,1) var(--t) both,i-vanish .28s ease-in var(--f) forwards}
      .intro__paper .c-base{stroke-dasharray:1 2;animation:i-draw .5s cubic-bezier(.4,0,.2,1) .04s both}
      .intro__paper .c-stem{stroke-dasharray:1 2;animation:i-draw .3s cubic-bezier(.2,.8,.3,1) var(--m) both}
      .intro__paper .c-xl{animation:i-rise .3s ease var(--m) both}
      .intro__paper .c-trend{stroke-dasharray:1 2;animation:i-draw .42s cubic-bezier(.5,0,.3,1) 1.3s both}
      .intro .b-run{animation:i-run .78s linear .58s both}
      .intro .b-drop{animation:i-drop .24s cubic-bezier(.55,0,1,.45) .34s both}
      .intro .b-hop{animation:i-hop .13s .58s 6}
      .intro .b-leap{animation:i-leap .32s 1.36s forwards}
      .intro .b-sq{animation:i-squash .13s linear .58s 6}
      .intro .b-sq2{animation:i-dropsq .24s .34s,i-leapsq .32s linear 1.36s forwards,i-land .24s ease-out 1.68s forwards}
      .intro .c-ball{animation:i-ignite .2s ease 1.66s forwards}
      .intro .c-shadow{animation:i-pop .24s ease-in .34s both,i-shadow .13s linear .58s 6,i-out .15s ease 1.36s forwards}
      .intro .c-pulse{animation:i-pulse .6s cubic-bezier(.2,.7,.3,1) 1.68s}
      .intro__ink .c-scrib{stroke-dasharray:1 2;animation:i-draw .34s cubic-bezier(.5,0,.3,1) 1.95s both}
      .intro__ink .c-ann{animation:i-rise .35s ease 2.05s both}

      /* Wordmark: a scaled copy of the header's, so it can land exactly on it */
      .intro__brand{display:flex;align-items:center;justify-content:center;pointer-events:none}
      .intro__lift{animation:i-lift .6s cubic-bezier(.2,.7,.2,1) 2.18s both}
      .intro__mark{display:flex;align-items:center;gap:calc(13px * var(--k));color:#f6f4eb;white-space:nowrap;transform-origin:0 0;transition:transform .6s cubic-bezier(.7,0,.2,1),color .3s ease .28s,opacity .25s ease}
      .intro__sym{font:700 calc(26px * var(--k))/1 'DM Sans',Arial,sans-serif;letter-spacing:-.12em;animation:i-track .55s cubic-bezier(.2,.8,.2,1) 2.18s both}
      .intro__sym span{color:#ea7253;padding:0 calc(2px * var(--k));animation:i-fade .25s ease 2.42s both,i-blink 1.1s ease-in-out 3.1s infinite}
      .intro__name{font-size:calc(12px * var(--k));font-weight:700;letter-spacing:.03em;clip-path:inset(-40% -10% -40% -4%);animation:i-reveal .45s cubic-bezier(.6,0,.2,1) 2.28s both}
      .intro__name small{display:block;margin-top:calc(2px * var(--k));color:#b7c2b4;font:calc(9px * var(--k)) 'DM Mono',monospace;letter-spacing:.03em;clip-path:inset(-40% -10% -40% -4%);transition:color .3s ease .28s;animation:i-reveal .45s cubic-bezier(.6,0,.2,1) 2.36s both}

      /* Hand-off (classes added by the script) */
      .is-docking .intro__paper{visibility:hidden}
      .is-docking .intro__inkwrap{clip-path:inset(var(--hh) 0 0 0)}
      .is-docking .intro__ink .intro__stagebox,.is-docking .intro__ink .intro__frame{opacity:0;transition:opacity .3s ease}
      .is-docking .intro__mark{color:#18221e}
      .is-docking .intro__name small{color:#6d756e}
      .is-docking .intro__lift,.is-docking .intro__sym,.is-docking .intro__sym span,.is-docking .intro__name,.is-docking .intro__name small{animation:none}
      .is-leaving .intro__inkwrap{opacity:0}
      .is-docked .intro__mark{opacity:0}
      .intro--still *{animation:none!important}
      .intro--still .intro__mark{color:#18221e}
      .intro--still .intro__name small{color:#6d756e}

      @media(max-width:800px){.intro{--frame:calc(100% - 48px)}}
      @media(max-width:650px){.intro{--hh:68px;--frame:calc(100% - 36px)}.intro__frame{font-size:8px}.intro__frame>:last-child{display:none}.intro__name{font-size:calc(11px * var(--k))}.intro__name small{font-size:calc(8px * var(--k))}}

      @keyframes i-fade{from{opacity:0}}
      @keyframes i-out{to{opacity:0}}
      @keyframes i-wipe-x{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
      @keyframes i-wipe-y{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
      @keyframes i-settle{from{scale:1.06}}
      @keyframes i-drift{from{translate:-16px 10px}}
      @keyframes i-recede{to{opacity:.2;translate:0 calc(6px * var(--k))}}
      @keyframes i-flood{from{clip-path:circle(0 at var(--fx,50%) var(--fy,50%))}}
      @keyframes i-draw{from{stroke-dashoffset:1.05}}
      @keyframes i-rise{from{opacity:0;translate:0 6px}}
      @keyframes i-pop{from{scale:0;opacity:0}to{scale:var(--s,1)}}
      @keyframes i-norm{from{scale:var(--s,1)}to{scale:1}}
      @keyframes i-sort{from{translate:var(--dx) var(--dy);rotate:var(--r,0deg)}}
      @keyframes i-vanish{to{scale:.2;opacity:0}}
      @keyframes i-run{to{translate:540px 0}}
      @keyframes i-drop{from{translate:0 -320px;opacity:0}20%{opacity:1}}
      @keyframes i-hop{0%,100%{translate:0 0;animation-timing-function:cubic-bezier(.3,.6,.45,1)}50%{translate:0 -42px;animation-timing-function:cubic-bezier(.55,0,.7,.4)}}
      @keyframes i-squash{0%,100%{scale:1.32 .7}14%{scale:.84 1.2}40%,60%{scale:1}86%{scale:.88 1.14}}
      @keyframes i-dropsq{from{scale:.8 1.3}to{scale:.86 1.18}}
      @keyframes i-leap{0%{translate:0 0;animation-timing-function:cubic-bezier(.2,.75,.35,1)}72%{translate:0 -240px;animation-timing-function:cubic-bezier(.55,0,.8,.45)}100%{translate:0 -211px}}
      @keyframes i-leapsq{0%{scale:1.3 .72}16%{scale:.72 1.36}55%{scale:.96 1.04}80%{scale:.9 1.12}100%{scale:1.24 .8}}
      @keyframes i-land{0%{scale:1.24 .8}50%{scale:.72 .86}100%{scale:.8}}
      @keyframes i-ignite{to{fill:#ea7253}}
      @keyframes i-shadow{0%,100%{scale:1.15}50%{scale:.55;opacity:.4}}
      @keyframes i-pulse{from{opacity:.9;scale:.8}to{opacity:0;scale:3}}
      @keyframes i-lift{from{translate:0 calc(10px * var(--k))}}
      @keyframes i-track{from{opacity:0;letter-spacing:.3em}}
      @keyframes i-reveal{from{clip-path:inset(-40% 100% -40% -4%)}}
      @keyframes i-blink{50%{opacity:.3}}
    </style>
  </head>
  <body>
    <script>
      /* Intro animation — builds the overlay styled in <head>, then docks its wordmark into the real header. */
      (function () {
        var d = document, de = d.documentElement, w = window;
        try {
          if (d.visibilityState === 'hidden' || (!/[?&]intro\b/.test(location.search) && sessionStorage.getItem('as-intro'))) return;
          sessionStorage.setItem('as-intro', '1');
        } catch (e) { /* storage blocked: just play */ }

        var still = w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var n2 = function (v) { return +v.toFixed(2); };

        // Final chart (viewBox 720×420, baseline y=330) and where each piece starts out "messy"
        var X = [130, 220, 310, 400, 490, 580], Y = [258, 236, 246, 190, 200, 112], REF = [280, 230, 180, 130];
        var DOTS = [[436, 64, 1.7], [646, 252, .8], [94, 126, 1.3], [534, 298, .6], [262, 46, 1.1]]; // x, y, scale
        var LINES = [[200, 96, 24], [540, 150, -32], [420, 286, 58], [120, 190, -14]];              // x, y, rotation
        var LABELS = [[350, 128, -14], [668, 160, 10], [160, 214, 20], [470, 36, -8]];
        var NOISE = [['t', 560, 92, -8, '0.42'], ['t', 300, 300, 10, '−8%'], ['t', 640, 52, 4, 'n=412'], ['t', 44, 262, -14, '3.1k'],
          ['t', 208, 160, 12, '17.6'], ['t', 392, 242, 0, 'Σx'], ['x', 118, 78], ['x', 472, 172], ['x', 690, 300], ['x', 330, 36],
          ['s', 566, 206, 20], ['s', 62, 52, -15], ['s', 250, 262, 35], ['o', 404, 300], ['o', 662, 214], ['o', 152, 36], ['l', 600, 140, 30], ['l', 160, 300, -40]];
        var land = function (k) { return n2(0.58 + (k + 1) * 0.13); }; // when the ball lands on column k

        // Scattered pieces pop in over ~0.4s in a shuffled (but fixed) order
        var pops = [], seed = 7;
        for (var i = 0; i < 31; i++) pops.push(n2(0.06 + i * 0.014));
        for (i = pops.length - 1; i > 0; i--) { seed = seed * 16807 % 2147483647; var j = seed % (i + 1), tmp = pops[i]; pops[i] = pops[j]; pops[j] = tmp; }
        var pop = function () { return '--t:' + pops.pop() + 's'; };

        function trend() {
          var p = X.map(function (x, i) { return [x, Y[i]]; }), s = 'M' + p[0];
          for (var i = 0; i < p.length - 1; i++) {
            var a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
            s += 'C' + [b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6, c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6, c[0], c[1]].map(Math.round);
          }
          return s;
        }

        // ink = the finished chart in hero colours (static, revealed by the flood); otherwise the animated sorting version
        function chart(ink) {
          var o = '<svg class="intro__stage" viewBox="0 0 720 420">';
          var sorted = function (dx, dy, rot, m, s, make) {
            return ink ? make('') : '<g class="s" style="--dx:' + dx + 'px;--dy:' + dy + 'px;--r:' + rot + 'deg;--m:' + m + 's">' + make(' style="' + pop() + ';--s:' + s + '"') + '</g>';
          };
          if (!ink) {
            o += '<g class="far">';
            NOISE.forEach(function (n) {
              var x = n[1], y = n[2], shape = n[0] === 't' ? '<text x="' + x + '" y="' + y + '">' + n[4] + '</text>'
                : n[0] === 'x' ? '<path d="M' + (x - 5) + ' ' + (y - 5) + 'l10 10m0-10l-10 10"/>'
                : n[0] === 's' ? '<rect x="' + (x - 4) + '" y="' + (y - 4) + '" width="8" height="8"/>'
                : n[0] === 'o' ? '<circle cx="' + x + '" cy="' + y + '" r="5"/>'
                : '<path d="M' + (x - 14) + ' ' + y + 'h28"/>';
              o += '<g class="n" style="' + pop() + ';--f:' + n2(Math.max(0.6, 0.58 + (x - 40) / 540 * 0.78)) + 's;rotate:' + (n[3] || 0) + 'deg">' + shape + '</g>';
            });
            o += '</g>';
          }
          o += '<path class="c-base" pathLength="1" d="M56 331C220 329 430 332 664 330"/>';
          REF.forEach(function (y, i) {
            var l = LINES[i], b = LABELS[i];
            o += sorted(l[0] - 360, l[1] - y, l[2], n2(0.64 + i * 0.06), '.12 1', function (st) { return '<path class="c-ref" d="M64 ' + y + 'H656"' + st + '/>'; });
            o += sorted(b[0] - 40, b[1] - y, b[2], n2(0.8 + i * 0.06), 1, function (st) { return '<text class="c-lab" x="52" y="' + (y + 4) + '"' + st + '>' + 25 * (i + 1) + '</text>'; });
          });
          X.forEach(function (x, k) {
            o += '<path class="c-stem" pathLength="1" d="M' + x + ' 330V' + (Y[k] + (k === 5 ? 7 : 5)) + '" style="--m:' + land(k) + 's"/>';
            o += '<text class="c-xl" x="' + x + '" y="356" style="--m:' + n2(land(k) + 0.04) + 's">0' + (k + 1) + '</text>';
          });
          o += '<path class="c-trend" pathLength="1" d="' + trend() + '"/>';
          DOTS.forEach(function (p, k) {
            o += sorted(p[0] - X[k], p[1] - Y[k], 0, n2(land(k) - 0.1), p[2], function (st) { return '<circle class="c-dot" cx="' + X[k] + '" cy="' + Y[k] + '" r="5"' + st + '/>'; });
          });
          o += ink
            ? '<circle class="c-peak" cx="580" cy="112" r="7.2"/><path class="c-scrib" pathLength="1" d="M562 100C570 86 600 86 605 104C610 122 590 134 572 130C553 126 550 104 566 95C574 90 590 90 598 95"/><text class="c-ann" x="618" y="104">insight.</text>'
            : '<g transform="translate(40 330)"><g class="b-run"><ellipse class="c-shadow" cx="0" cy="1" rx="9" ry="2.2"/><g class="b-drop"><g class="b-hop"><g class="b-leap"><g class="b-sq"><g class="b-sq2"><circle class="c-ball" cx="0" cy="-9" r="9"/></g></g></g></g></g></g></g><circle class="c-pulse" cx="580" cy="112" r="8"/>';
          return o + '</svg>';
        }

        // The hero's ambient light + ink forms (styled by the site CSS), so the panel already matches the hero when it lifts
        var atmos = '<div class="hero-atmos"><div class="atmos-light">' + '<span></span>'.repeat(4) + '</div><div class="atmos-forms">' + '<span></span>'.repeat(4) + '</div></div>';
        var frame = function (cap) { return '<div class="intro__frame"><p class="intro__cap">' + cap + '</p><p>MAKING DATA MEAN MORE.</p></div>'; };
        var mark = '<div class="intro__brand"><div class="intro__lift"><div class="intro__mark"><span class="intro__sym">A<span>·</span>S</span><span class="intro__name">Abdul Samhoon<small>DATA / ANALYSIS / INSIGHT</small></span></div></div></div>';
        var root = d.createElement('div');
        root.className = 'intro' + (still ? ' intro--still' : '');
        root.setAttribute('aria-hidden', 'true');
        root.innerHTML = still ? '<div class="intro__paper"></div>' + mark
          : '<div class="intro__paper"><div class="intro__grid intro__grid--v"></div><div class="intro__grid intro__grid--h"></div>'
            + frame('<span>FIG. 00 — RAW / UNSORTED</span><span>FIG. 00 — SORTING</span>') + '<div class="intro__stagebox">' + chart(false) + '</div></div>'
            + '<div class="intro__inkwrap"><div class="intro__ink"><div class="intro__herobox">' + atmos + '<div class="intro__herogrid"></div></div>'
            + frame('FIG. 00 — SIGNAL / INSIGHT') + '<div class="intro__stagebox">' + chart(true) + '</div></div></div>' + mark;
        d.body.insertBefore(root, d.body.firstChild);
        de.classList.add('intro-on');

        var markEl = root.querySelector('.intro__mark'), symEl = root.querySelector('.intro__sym'), smallEl = root.querySelector('small'), peak = root.querySelector('.c-peak');
        var t0 = Date.now(), timers = [], state = 'play', held = false;
        var later = function (fn, ms) { timers.push(setTimeout(fn, ms)); };
        var px = function (name, v) { root.style.setProperty(name, Math.round(v * 10) / 10 + 'px'); };

        function layout() {
          root.style.setProperty('--k', Math.min(3, Math.max(1.2, (w.innerWidth - 48) / 205)).toFixed(3));

        function sync() {

          if (hero) { var r = hero.getBoundingClientRect(); px('--gt', r.top); px('--gh', r.height); }

        }

          var m = markEl.getBoundingClientRect(), a = symEl.getBoundingClientRect(), b = target.getBoundingClientRect(), s = b.width / a.width;

          markEl.style.transform = 'translate(' + (b.left - m.left - (a.left - m.left) * s) + 'px,' + (b.top - m.top - (a.top - m.top) * s) + 'px) scale(' + s + ')';

          later(function () { de.classList.remove('intro-on'); root.classList.add('is-docked'); }, 600);
          later(done, 900);
        }
        function leave() {
          state = 'leaving';
          de.classList.remove('intro-on');
          root.classList.add('is-fading');
          later(done, 400);
        }
        function done() {
          timers.forEach(clearTimeout);
          de.classList.remove('intro-on');
          root.remove();
          w.removeEventListener('resize', layout);
          ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (e) { w.removeEventListener(e, skip); });
        }
        function skip() { if (state === 'play') leave(); }
        function hold() { if (!held) { held = true; ready(); } }

        layout();
        w.addEventListener('resize', layout);
        ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (e) { w.addEventListener(e, skip, { passive: true }); });
        later(skip, 9000); // hard stop, whatever else happens
        if (still) hold();
        else {
          root.addEventListener('animationend', function (e) { if (e.target === smallEl && e.animationName === 'i-reveal') hold(); });

          root.addEventListener('animationstart', function begin() {

            later(hold, 3600); // fallback in case animationend never arrives

          });
        }
      })();
